[package]
name = "vesuvius-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
# src/bin/ adds pane-harness; keep `cargo run -p vesuvius-gui` launching the GUI.
default-run = "vesuvius-gui"

[dependencies]
vesuvius-rs       = { path = "../vesuvius-rs" }
vesuvius-atlas-rs = { path = "../vesuvius-atlas-rs" }
vesuvius-zarr     = { path = "../vesuvius-zarr" }

clap        = { workspace = true }
directories = { workspace = true }
eframe      = { workspace = true }
egui        = { workspace = true }
egui_extras = { workspace = true }
ehttp       = { workspace = true }
emath       = { workspace = true }
futures     = { workspace = true }
fxhash      = { workspace = true }
image       = { workspace = true }
log         = { workspace = true }
quanta      = { workspace = true }
rand        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { workspace = true }
